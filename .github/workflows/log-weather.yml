name: Log weather & visibility data

on:
  schedule:
    # Every 6 hours, UTC. Melbourne is UTC+10 (AEST) or UTC+11 (AEDT during
    # daylight saving) - the exact local times this lands on will shift by an
    # hour across the DST change, but the 6-hourly cadence itself doesn't need
    # to line up with any particular local time to be useful.
    - cron: "0 */6 * * *"
  # Lets you trigger a run manually from the Actions tab, e.g. right after
  # setup or after editing locations.csv.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and log weather/visibility data
        run: python scripts/fetch_and_log.py

      - name: Commit and push if data changed
        run: |
          git config user.name "spearfishing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data this run."
          else
            git commit -m "Log weather data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
